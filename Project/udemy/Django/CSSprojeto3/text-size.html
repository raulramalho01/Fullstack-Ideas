<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>text-sze</title>

    <style type="text/css">
        /* id */
        /* class */
        .texto{
            font-size: 100%;
        }
        /* selectors */
        div {
            font-size: 150%;
        }
    </style>
</head>

<body>
    <h1>Hello World!</h1>
    <p class="texto">Parágrafo fora da div com class</p>
    <div>
        <!-- 0.5em relativo a class pai -->
        <!-- Quem manda é a div -->
        <p class="texto">Parágrafo com class</p>
        <p>Parágrafo sem class</p>
 
    </div>
</body>

</html>
