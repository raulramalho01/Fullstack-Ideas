<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Div-span site</title>

    <style type="text/css">
        /* id */
        #logo{
            background: blue;
        }

        #product_list {
            background: red;
        }

        
        #rodape{
            background: green;
        }

        #assinatura{
            background: pink;
        }
        /* classes */
        .product_one{
            background: grey;
            margin: 10px;
        }

    </style>
</head>

<body>
    <!-- span é inline e concatena com o prox span
     div fica abaixo do outro -->
    <div id="logo">
        <img src="amazon.png" width="200px">
        <ul>
            <li>Home</li>
            <li>Produtos</li>
            <li>Contato</li>

        </ul>
    </div>

    <div id="product_list">
        <div class="product_one">produto 1</div>
        <div class="product_one">produto 2</div>
        <div class="product_one">produto 3</div>

    </div>

    <div id="rodape">
        <p>Todos os direitos reservados &copy;</p>
        <span id="assinatura">Jailson</span>
    </div>

</body>

</html>
